plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lifescc.cc'
    compileSdk 34

    defaultConfig {
        applicationId "com.lifescc.cc"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed by default for easy sideloading (no Play Store).
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align all Kotlin stdlib modules to one version (fixes "Duplicate class kotlin.collections.jdk8")
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
